<text x="840" y="392" text-anchor="middle" dominant-baseline="central" font-size="15" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#6b7280">INDEPENDENT DOMAIN STATES</text>
<text x="840" y="416.7307692307692" text-anchor="middle" dominant-baseline="central" font-size="24" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b"><tspan font-family="&quot;Long Cang&quot;, sans-serif">提取状态</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> · </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">复核状态</tspan></text>
<text x="840" y="446.7307692307692" text-anchor="middle" dominant-baseline="central" font-size="24" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b"><tspan font-family="&quot;Long Cang&quot;, sans-serif">渲染状态</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> · </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">交付状态</tspan></text>
<text x="840" y="476.7307692307692" text-anchor="middle" dominant-baseline="central" font-size="24" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">彼此独立</text>
<rect x="650" y="615" width="380" height="170" fill="#ffe4e6" stroke="#e11d48" stroke-width="3" rx="8"/>
<text x="840" y="646" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#6b7280">RENDERED ≠ REVIEWED</text>
<text x="840" y="657.6923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">渲染成功</text>
<text x="840" y="682.6923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">不能授权提取或复核</text>
<text x="840" y="707.6923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">图形复现通过</text>
<text x="840" y="732.6923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">不能证明正文主张正确</text>
<rect x="1110" y="360" width="390" height="215" fill="#dcfce7" stroke="#15803d" stroke-width="3" rx="8"/>
<text x="1305" y="392" text-anchor="middle" dominant-baseline="central" font-size="15" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#6b7280">STEP 8 · CONSERVATIVE REVISION</text>
<text x="1305" y="434.71153846153845" text-anchor="middle" dominant-baseline="central" font-size="22" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">只处理既有正文</text>
<text x="1305" y="462.21153846153845" text-anchor="middle" dominant-baseline="central" font-size="22" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b"><tspan font-family="&quot;Long Cang&quot;, sans-serif">保护引用</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive">·</tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">公式</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive">·</tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">参数</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive">·</tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">责任主体</tspan></text>
<text x="1305" y="489.71153846153845" text-anchor="middle" dominant-baseline="central" font-size="22" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b"><tspan font-family="&quot;Long Cang&quot;, sans-serif">诊断</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> → </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">修订台账</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> → </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">保真回读</tspan></text>
<rect x="1130" y="625" width="360" height="125" fill="#fee2e2" stroke="#dc2626" stroke-width="3" rx="8"/>
<text x="1310" y="654" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#6b7280">NO NEW EVIDENCE · NO CLAIM DRIFT</text>
<text x="1310" y="670.1923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">不新增未经确认的证据</text>
<text x="1310" y="695.1923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">不把语言优化变成观点漂移</text>
<text x="1310" y="823" text-anchor="middle" dominant-baseline="central" font-size="23" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#15803d">DELIVERABLES</text>
<text x="1310" y="857" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#15803d"><tspan font-family="&quot;Long Cang&quot;, sans-serif">稿件</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> · </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">图表</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> · </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">引用与公式审计</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> · </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">文档</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> · </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">交接块</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive"> · </tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">修订台账</tspan></text>
<text x="820" y="327" text-anchor="middle" dominant-baseline="central" font-size="22" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">最终目标：可继续写、可审、可追溯，而不只是一次聊天输出。</text>
