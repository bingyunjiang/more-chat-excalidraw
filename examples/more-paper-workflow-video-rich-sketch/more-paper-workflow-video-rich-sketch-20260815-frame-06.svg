<rect x="0" y="0" width="1600" height="900" fill="none" stroke="#a5d8ff" stroke-width="2" stroke-dasharray="8 4"/>
<text x="8" y="18" font-size="16" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#1971c2"><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive">06 </tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive">完成门与交付：什么时候才能说完成</tspan></text>
<text x="70" y="78" text-anchor="start" dominant-baseline="central" font-size="20" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#2563eb">06 / COMPLETION</text>
<text x="70" y="124" text-anchor="start" dominant-baseline="central" font-size="24" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#2563eb">GATES · INDEPENDENT STATES · CONSERVATIVE REVISION</text>
<text x="70" y="183" text-anchor="start" dominant-baseline="central" font-size="40" font-family="&quot;Ma Shan Zheng&quot;, sans-serif" fill="#2b2b2b">完成声明，是一项受约束的工程动作</text>
<text x="72" y="241" text-anchor="start" dominant-baseline="central" font-size="23" font-family="&quot;Long Cang&quot;, sans-serif" fill="#4b5563">质量门很多；完成门只回答：当前主产物是否可交接，风险是否透明，下一步是否有足够输入。</text>
<path d="M70.0,280.0 L1530.0,280.0" fill="none" stroke="#d1d5db" stroke-width="2"/>
<text x="335" y="350" text-anchor="middle" dominant-baseline="central" font-size="25" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#dc2626">COMPLETION GATE</text>
