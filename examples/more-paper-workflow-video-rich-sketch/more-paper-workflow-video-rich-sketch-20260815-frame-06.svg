<text x="335" y="813" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#6b7280">CANDIDATE IS NOT CONCLUSION</text>
<text x="335" y="832.6923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">候选不冒充结论</text>
