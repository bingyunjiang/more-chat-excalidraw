<text x="335" y="408" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#6b7280">PRIMARY OUTPUT EXISTS</text>
<text x="335" y="427.6923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">核心产物存在</text>
<rect x="85" y="515" width="500" height="105" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" rx="8" transform="rotate(0.6875 335 567.5)"/>
<text x="335" y="543" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="Virgil, &quot;Comic Sans MS&quot;, cursive" fill="#6b7280">STATUS IS SEPARATED</text>
<text x="335" y="550.1923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b"><tspan font-family="&quot;Long Cang&quot;, sans-serif">成功</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive">·</tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">风险</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive">·</tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">失败</tspan><tspan font-family="Virgil, &quot;Comic Sans MS&quot;, cursive">·</tspan><tspan font-family="&quot;Long Cang&quot;, sans-serif">待人工</tspan></text>
<text x="335" y="575.1923076923077" text-anchor="middle" dominant-baseline="central" font-size="20" font-family="&quot;Long Cang&quot;, sans-serif" fill="#2b2b2b">已经区分</text>
